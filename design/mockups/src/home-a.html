<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Kindle home mock — A</title>
<style>
  @font-face{
    font-family:"Noto Sans JP Mock";
    src:url("../fonts/NotoSansJP.ttf") format("truetype");
    font-weight:100 900;
    font-style:normal;
  }
  :root{
    --ink:#000;
    --mid:#6b6b6b;
    --paper:#fff;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1072px;height:1448px;background:var(--paper)}
  body{
    font-family:"Noto Sans JP Mock","Hiragino Sans","Hiragino Kaku Gothic ProN",sans-serif;
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
  }
  .screen{
    position:relative;
    width:1072px;
    height:1448px;
    padding:0 52px;
    display:flex;
    flex-direction:column;
    overflow:hidden;
  }

  /* ---------- status bar ---------- */
  .status{
    height:100px;
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
  .status .time{
    font-size:34px;
    font-weight:600;
    letter-spacing:1px;
  }
  .status .icons{display:flex;align-items:center;gap:16px}
  .status svg{display:block}

  /* ---------- clock widget ---------- */
  .clock{margin-top:46px}
  .clock .time{
    font-size:232px;
    font-weight:700;
    line-height:.9;
    letter-spacing:-9px;
    font-feature-settings:"tnum" 1;
  }
  .clock .date{
    margin-top:26px;
    font-size:46px;
    font-weight:500;
    letter-spacing:1px;
  }
  .clock .date .dim{color:var(--mid)}

  /* ---------- app grid ---------- */
  .grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
  }
  .apps{margin-top:92px}
  .cell{
    display:flex;
    flex-direction:column;
    align-items:center;
  }
  .app-icon{
    width:186px;
    height:186px;
    border-radius:44px;
    background:var(--ink);
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .app-icon svg{width:104px;height:104px;color:#fff}
  .cell .label{
    margin-top:22px;
    font-size:32px;
    font-weight:500;
    letter-spacing:.5px;
    line-height:1.35;
  }

  /* ---------- bookmark shortcuts ---------- */
  .sec{margin-top:84px}
  .sec-head{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
  }
  .sec-head h2{
    font-size:30px;
    font-weight:700;
    letter-spacing:1px;
  }
  .sec-head .count{
    font-size:28px;
    font-weight:500;
    color:var(--mid);
    letter-spacing:1px;
  }
  .sites{margin-top:26px}
  .site-tile{
    width:186px;
    height:186px;
    border:3px solid var(--ink);
    border-radius:44px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:68px;
    font-weight:700;
    letter-spacing:-1px;
  }
  .site-tile.two{font-size:56px;letter-spacing:0}

  /* ---------- bottom chrome ---------- */
  .pager{
    margin-top:auto;
    margin-bottom:52px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:14px;
  }
  .pager i{
    display:block;
    width:24px;
    height:10px;
    border-radius:5px;
    background:var(--mid);
  }
  .pager i.on{width:44px;background:var(--ink)}
  .homebar{
    width:400px;
    height:9px;
    border-radius:5px;
    background:var(--ink);
    margin:0 auto 24px;
  }
</style>
</head>
<body>
<div class="screen">

  <!-- status bar -->
  <div class="status">
    <div class="time">10:42</div>
    <div class="icons">
      <!-- wifi -->
      <svg width="46" height="34" viewBox="0 0 32 24" fill="none" stroke="#000" stroke-width="2.6" stroke-linecap="round">
        <path d="M4.5 9.6a15.5 15.5 0 0 1 23 0"/>
        <path d="M9 14.2a9.2 9.2 0 0 1 14 0"/>
        <path d="M13.4 18.6a3.6 3.6 0 0 1 5.2 0"/>
        <circle cx="16" cy="21.4" r="1.8" fill="#000" stroke="none"/>
      </svg>
      <!-- battery -->
      <svg width="56" height="28" viewBox="0 0 34 18" fill="none">
        <rect x="1.5" y="1.5" width="27" height="15" rx="3.5" stroke="#000" stroke-width="3"/>
        <rect x="30.5" y="6" width="3" height="6" rx="1.5" fill="#000"/>
        <rect x="5" y="5" width="16" height="8" rx="1.5" fill="#000"/>
      </svg>
    </div>
  </div>

  <!-- clock -->
  <div class="clock">
    <div class="time">10:42</div>
    <div class="date">10月23日 <span class="dim">木曜日</span></div>
  </div>

  <!-- apps -->
  <div class="grid apps">
    <div class="cell">
      <div class="app-icon">
        <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <rect x="7" y="9" width="34" height="30" rx="2.5"/>
          <path d="M12.5 15.5h14"/>
          <path d="M12.5 21.5h9"/>
          <path d="M12.5 26.5h9"/>
          <path d="M12.5 31.5h6"/>
          <rect x="26" y="20.5" width="9.5" height="11"/>
        </svg>
      </div>
      <div class="label">新聞</div>
    </div>

    <div class="cell">
      <div class="app-icon">
        <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 10.5h30a2 2 0 0 1 2 2v18a2 2 0 0 1-2 2H25l-9 7v-7H9a2 2 0 0 1-2-2v-18a2 2 0 0 1 2-2z"/>
          <path d="M13 17.5h22"/>
          <path d="M13 23.5h16"/>
        </svg>
      </div>
      <div class="label">漫画</div>
    </div>

    <div class="cell">
      <div class="app-icon">
        <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="24" cy="24" r="15.5"/>
          <ellipse cx="24" cy="24" rx="7.5" ry="15.5"/>
          <path d="M8.5 24h31"/>
          <path d="M10.6 16.5h26.8"/>
          <path d="M10.6 31.5h26.8"/>
        </svg>
      </div>
      <div class="label">ブラウザ</div>
    </div>

    <div class="cell">
      <div class="app-icon">
        <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="24" cy="24" r="10.4" stroke-width="3.4"/>
          <circle cx="24" cy="24" r="4.6" stroke-width="3.4"/>
          <g fill="currentColor" stroke="none">
            <rect x="20.2" y="6.2" width="7.6" height="6" rx="1.6"/>
            <rect x="20.2" y="6.2" width="7.6" height="6" rx="1.6" transform="rotate(45 24 24)"/>
            <rect x="20.2" y="6.2" width="7.6" height="6" rx="1.6" transform="rotate(90 24 24)"/>
            <rect x="20.2" y="6.2" width="7.6" height="6" rx="1.6" transform="rotate(135 24 24)"/>
            <rect x="20.2" y="6.2" width="7.6" height="6" rx="1.6" transform="rotate(180 24 24)"/>
            <rect x="20.2" y="6.2" width="7.6" height="6" rx="1.6" transform="rotate(225 24 24)"/>
            <rect x="20.2" y="6.2" width="7.6" height="6" rx="1.6" transform="rotate(270 24 24)"/>
            <rect x="20.2" y="6.2" width="7.6" height="6" rx="1.6" transform="rotate(315 24 24)"/>
          </g>
        </svg>
      </div>
      <div class="label">設定</div>
    </div>
  </div>

  <!-- bookmark shortcuts -->
  <div class="sec">
    <div class="sec-head">
      <h2>お気に入り</h2>
      <div class="count">3 件</div>
    </div>
    <div class="grid sites">
      <div class="cell">
        <div class="site-tile">Z</div>
        <div class="label">Zenn</div>
      </div>
      <div class="cell">
        <div class="site-tile two">HN</div>
        <div class="label">Hacker News</div>
      </div>
      <div class="cell">
        <div class="site-tile">W</div>
        <div class="label">Wikipedia</div>
      </div>
    </div>
  </div>

  <!-- bottom chrome -->
  <div class="pager"><i class="on"></i><i></i><i></i></div>
  <div class="homebar"></div>
</div>
</body>
</html>
